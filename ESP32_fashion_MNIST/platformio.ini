; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200  

build_flags =
    ; --- 1. General C++ and Optimization Flags ---
    -std=gnu++17
    -O3
    
    ; --- 2. PSRAM Configuration Flags (Ensures external memory usage) ---
    -DCONFIG_SPIRAM_BOOT_INIT
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC
    -DCONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY=1
    
    ; --- 3. CRITICAL: Include Paths for TFLite Dependencies ---
    ; This exposes FlatBuffers and Fixedpoint headers which TFLite needs internally.
    ; This is the solution for 'flatbuffers/flatbuffers.h' and 'fixedpoint/fixedpoint.h' errors.
    -I.pio/libdeps/$PROJECT_ENV_NAME/esp-tflite-micro/third_party/flatbuffers/include
    -I.pio/libdeps/$PROJECT_ENV_NAME/esp-tflite-micro/tensorflow/lite/micro/third_party/fixedpoint/
    -I.pio/libdeps/$PROJECT_ENV_NAME/esp-tflite-micro/tensorflow/lite/micro/third_party/ruy/ruy

    ; --- 4. C++ Linkage Flags (Fixes 'unresolved symbol' errors) ---
    -lstdc++
    -lm